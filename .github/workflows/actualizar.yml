name: Actualizar datos

on:
  schedule:
    - cron: "0 11 * * *"   # todos los dias, 6:00 a.m. hora de Colombia
  workflow_dispatch:        # permite ejecutarlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar librerías
        run: python -m pip install -r requirements.txt

      - name: Descargar y procesar los datos
        run: python actualizar_todo.py

      - name: Preparar los datos de la página web
        run: python exportar_web.py

      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Actualización diaria de datos"
          git pull --rebase --autostash -X theirs
          git push
